name: SnuffAC
version: 1.0.2-dev
main: dev.snuffac.paper.SnuffPaperPlugin
api-version: '1.21'
author: Snuff
description: Snuff AC, an independent movement and combat anticheat.
website: https://github.com/snuff-ac/Snuff-AC
folia-supported: false
load: STARTUP
softdepend:
  - packetevents

commands:
  snuff:
    description: Snuff AC administration
    usage: /snuff help
    permission: snuffac.admin
    aliases:
      - snuffac

permissions:
  snuffac.admin:
    description: Full access to every Snuff AC command
    default: op
    children:
      snuffac.debug: true
      snuffac.alerts: true
      snuffac.menu: true
      snuffac.punish.ban: true
      snuffac.punish.tempban: true
      snuffac.punish.ipban: true
      snuffac.punish.kick: true
      snuffac.punish.mute: true
      snuffac.punish.warn: true
      snuffac.punish.unban: true
      snuffac.punish.maxduration.30d: true
      snuffac.bypass: false
  snuffac.menu:
    description: Open the Snuff AC menus
    default: op
  snuffac.debug:
    description: Receive violation alerts and use debug output
    default: op
  snuffac.alerts:
    description: Receive violation alerts
    default: op
  snuffac.bypass:
    description: Exempt from all Snuff AC checks
    default: false
  snuffac.punish.ban:
    description: Ban and temporary ban players
    default: op
  snuffac.punish.tempban:
    description: Temporary ban players
    default: op
  snuffac.punish.ipban:
    description: Ban by address
    default: op
  snuffac.punish.kick:
    description: Kick and timeout players
    default: op
  snuffac.punish.mute:
    description: Mute players
    default: op
  snuffac.punish.warn:
    description: Warn players
    default: op
  snuffac.punish.unban:
    description: Lift any punishment
    default: op
  snuffac.punish.maxduration.1h:
    description: May punish for up to one hour
    default: false
  snuffac.punish.maxduration.1d:
    description: May punish for up to one day
    default: false
  snuffac.punish.maxduration.7d:
    description: May punish for up to seven days
    default: false
  snuffac.punish.maxduration.30d:
    description: May punish for up to thirty days
    default: false
  snuffac.exempt.punish:
    description: Cannot be punished by staff
    default: false

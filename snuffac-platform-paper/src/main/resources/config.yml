general:
  enabled: true
  debug: false
  alert-prefix: 'Snuff'
  alerts: true
  console-alerts: true
  console-alert-format: '[{prefix}] {player} failed {check} | VL: {vl} | ping: {ping}ms'
  console-alert-format-verbose: ''
  alert-cooldown-ms: 1500
  log-to-file: true
  history-retention-days: 90
  history-per-player: 200
  alert-on-rejoin-with-history: true
  log-directory: 'logs'
  permissions:
    debug: 'snuffac.debug'
    bypass: 'snuffac.bypass'
    admin: 'snuffac.admin'
    alerts: 'snuffac.alerts'

setback:
  horizontal: 0.0
  vertical: 0.0
  max-violations-per-second: 40

prevention:
  # When disabled Snuff AC still flags and records, but takes no corrective action.
  enabled: true
  # Minimum accumulated confidence before a preventive action is taken.
  min-confidence: 0.55

compatibility:
  # Bedrock players arriving through Geyser or Floodgate move fundamentally
  # differently from Java clients. They are exempted from movement checks by
  # default. Packet level checks still run.
  exempt-bedrock: true
  # Clients older than 1.8 through ViaVersion use different movement semantics,
  # including the double tap position quirk and a larger movement epsilon.
  exempt-legacy-protocol: true
  # Allow clients whose protocol version could not be determined at all.
  allow-unknown-protocols: true
  # Void generators create worlds with no floor. A player falling forever will
  # accumulate unbounded air time, so movement checks stop below this height.
  exempt-void-worlds: true
  void-world-floor: -60

escalation:
  # Warns a player each time a confident flag lands, then applies one timed
  # ban once the warning limit is reached. Off by default, because automatic
  # punishment can never be risk free. Turn this on only after tuning the
  # thresholds on your own server.
  enabled: false
  max-warnings: 5
  ban-duration-millis: 3600000
  # Only warn on confident detections. Raise this to make the ladder much
  # more reluctant, lower it only if you are certain about your thresholds.
  min-confidence: 0.75
  # Warn and never ban, so staff make the final call.
  warn-only: false

anti-xray:
  # Replaces valuable ores with a decoy state in the chunks the server sends,
  # so a client has no ore data to reveal. This drives the server's own chunk
  # obfuscation engine at startup and only takes effect on restart.
  # X-Ray, block ESP and storage ESP can never be DETECTED, only prevented this
  # way. The player must still be sent the block, just not its real identity.
  # OFF, HIDDEN_ORES, HIDDEN_ORES_AND_DEEPSLATE
  mode: 'HIDDEN_ORES'
  band-start: -16
  band-end: 320
  # Also withhold container block data. This can break container views in the
  # overworld, so it is off by default.
  hide-containers: false

tolerance:
  decay-per-tick: 0.35
  maximum: 0.45
  carry-over-cap: 1.0
  carry-over-retention: 0.4
  base: 0.001
  ping-floor: 0.001
  ping-per-ms: 0.00002
  ping-maximum: 0.06
  tps-floor: 0.001
  tps-per-miss: 0.004
  tps-maximum: 0.05
  safe-tps: 19.0
  low-tps-safety: 17.0

combat:
  reach:
    maximum: 3.35
    tolerance: 0.12
    vehicle-tolerance: 0.45
    latency-multiplier: 0.0022
    max-latency-bonus: 0.35
  autoclicker:
    max-cps: 22.0
    window-size: 40

packets:
  bad-packets:
    max-per-second: 60.0
  timer:
    minimum-tps: 20.0
    max-deviation: 1.2
    exemption-ping: 400.0

world:
  fast-break:
    max-per-second: 22

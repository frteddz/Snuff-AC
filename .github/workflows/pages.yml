name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sync-site-changelog.py'
      - 'check-description.py'
      - 'check-style.py'
      - 'description-modrinth-curseforge.md'
      - 'CHANGELOG.md'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: check the release data and the description agree
        run: |
          python3 sync-site-changelog.py
          python3 check-description.py

      - name: fail on an em dash or a comment
        run: python3 check-style.py

      - name: install
        working-directory: web
        run: npm ci

      - name: build
        working-directory: web
        run: npm run build

      - name: publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_COMMIT: ${{ github.sha }}
        run: web/scripts/deploy-pages.sh

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
